<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEGO Verhuur — Trends &amp; koopadvies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg0:#0A1120;--bg1:#16223C;--panel:#101B30;--panel2:#0C1526;--ink:#F5F7FA;--mute:#93A0B6;
    --line:#243450;--amber:#FFC72C;--green:#37E27A;--red:#FF5A5F;--steel:#6FA8FF;--grey:#6C7A93}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(160deg,var(--bg0),var(--bg1));min-height:100vh;color:var(--ink);
    font-family:"Archivo",system-ui,sans-serif;padding:24px 16px 70px;display:flex;justify-content:center}
  .app{width:100%;max-width:840px}
  .head{display:flex;align-items:center;gap:12px}
  .rec{width:14px;height:14px;border-radius:50%;background:var(--red)}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-weight:800;letter-spacing:.24em;font-size:12px;color:var(--amber);text-transform:uppercase}
  h1{font-family:"Archivo Black",sans-serif;font-size:clamp(24px,5vw,38px);letter-spacing:-.02em;margin:2px 0 4px}
  .lede{color:var(--mute);font-size:14px;max-width:620px;margin-bottom:14px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .btn{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);padding:9px 12px;border-radius:9px;cursor:pointer}
  .btn:hover{background:rgba(255,199,44,.12);border-color:var(--amber)}
  #hurl{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:12px;padding:9px 11px;outline:none}

  .setcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .rank{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:20px;color:var(--mute);width:34px;flex:0 0 auto;text-align:center}
  .info{flex:1;min-width:180px}
  .nm{font-weight:800;font-size:18px}
  .nm .nr{color:var(--amber);font-family:"JetBrains Mono",monospace;font-size:13px;margin-right:8px}
  .stats{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--mute);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
  .stats b{color:var(--ink)}
  .up{color:var(--green)} .down{color:var(--red)}
  .chart{flex:0 0 auto}
  svg{display:block}
  .advice{flex:0 0 auto;text-align:right;min-width:150px}
  .pill{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:13px;padding:6px 12px;border-radius:99px;display:inline-block}
  .pill.koop{background:rgba(55,226,122,.16);color:var(--green)}
  .pill.over{background:rgba(255,199,44,.16);color:var(--amber)}
  .pill.wacht{background:rgba(140,148,166,.14);color:var(--mute)}
  .reason{font-size:12px;color:var(--mute);margin-top:8px;max-width:200px;margin-left:auto}
  .note{font-size:12px;color:var(--grey);line-height:1.55;border-left:2px solid var(--line);padding-left:12px;margin-top:14px}
  .empty{color:var(--mute);font-family:"JetBrains Mono",monospace;font-size:13px;padding:20px 0}
</style>
</head>
<body>
<div class="app">
  <div class="head"><span class="rec"></span><span class="eyebrow">Trends &amp; koopadvies</span></div>
  <h1>Waar moet je in investeren?</h1>
  <div class="lede">Per set de vraag-trend over tijd, met een koopadvies uit vraag, schaarste en richting. Gesorteerd op sterkste signaal.</div>
  <div class="bar">
    <input id="hurl" placeholder="history.json" value="history.json">
    <button class="btn" onclick="refresh()">🔄 Ververs</button>
    <button class="btn" onclick="document.getElementById('f').click()">📂 Laad history.json</button>
    <input id="f" type="file" accept=".json" style="display:none">
  </div>
  <div id="list"><div class="empty">History laden…</div></div>
  <div class="note" id="note"></div>
</div>

<script>
let HIST = null, NAMES = {};
const $ = id => document.getElementById(id);
const eur = v => v==null ? "—" : "€"+Number(v).toFixed(2).replace(".", ",");

function advice(arr){
  const a = arr[arr.length-1], f = arr[0];
  const carry = a.carry||0, un = a.un||0;
  const unrate = carry ? un/carry : 0;
  const scoreTrend = (a.score||0) - (f.score||0);
  const priceTrend = (a.min!=null && f.min!=null) ? (a.min - f.min) : 0;
  let koop = 0.7*(a.score||0) + Math.max(0,Math.min(scoreTrend,15)) + (unrate>=0.5?15:0);
  koop = Math.round(Math.max(0,Math.min(100,koop)));
  const label = koop>=60 ? ["Sterk koopsignaal","koop"] : koop>=35 ? ["Overwegen","over"] : ["Afwachten","wacht"];
  const reasons=[];
  if(unrate>=0.5) reasons.push("vaak uitverhuurd ("+Math.round(unrate*100)+"% van de verhuurders)");
  if(scoreTrend>=5) reasons.push("stijgende vraag");
  else if(scoreTrend<=-5) reasons.push("dalende vraag");
  if(carry>=5) reasons.push("breed aanbod = bewezen vraag");
  if(!reasons.length) reasons.push("stabiel, geen duidelijk signaal");
  return {koop,label,unrate,scoreTrend,priceTrend,carry,un,latest:a,reason:reasons.slice(0,2).join(" · ")};
}

function spark(arr){
  const W=180,H=60,p=6, n=arr.length;
  const xs=i=> n<2? W/2 : p + (W-2*p)*i/(n-1);
  const ys=v=> H-p - (H-2*p)*(Math.max(0,Math.min(100,v))/100);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">';
  s+='<line x1="'+p+'" y1="'+ys(50)+'" x2="'+(W-p)+'" y2="'+ys(50)+'" stroke="#22304A" stroke-dasharray="3 4"/>';
  const pts=arr.map((e,i)=>xs(i)+','+ys(e.score||0)).join(' ');
  s+='<polyline points="'+pts+'" fill="none" stroke="#FFC72C" stroke-width="2.5"/>';
  arr.forEach((e,i)=>{ s+='<circle cx="'+xs(i)+'" cy="'+ys(e.score||0)+'" r="3" fill="#FFC72C"/>'; });
  s+='<text x="'+p+'" y="12" fill="#6C7A93" font-size="9" font-family="JetBrains Mono">vraag-score</text>';
  s+='</svg>';
  return s;
}

function render(){
  const list=$("list");
  if(!HIST || !HIST.series){ list.innerHTML='<div class="empty">Geen history-data gevonden.</div>'; return; }
  const rows = Object.entries(HIST.series)
    .filter(([nr,arr])=>arr && arr.length)
    .map(([nr,arr])=>({nr, arr, ...advice(arr)}))
    .sort((a,b)=>b.koop-a.koop);
  if(!rows.length){ list.innerHTML='<div class="empty">Nog geen datapunten.</div>'; return; }
  list.innerHTML = rows.map((r,idx)=>{
    const name = NAMES[r.nr] || "";
    const pt = r.priceTrend, arrow = pt>0.01?'<span class="down">▲</span>':pt<-0.01?'<span class="up">▼</span>':'';
    return '<div class="setcard">'+
      '<div class="rank">'+(idx+1)+'</div>'+
      '<div class="info"><div class="nm"><span class="nr">#'+r.nr+'</span>'+(name||'')+'</div>'+
        '<div class="stats"><span>score <b>'+(r.latest.score||0)+'</b> '+(r.scoreTrend>0?'<span class="up">+'+r.scoreTrend+'</span>':r.scoreTrend<0?'<span class="down">'+r.scoreTrend+'</span>':'')+'</span>'+
        '<span>laagste <b>'+eur(r.latest.min)+'</b> '+arrow+'</span>'+
        '<span><b>'+r.carry+'</b> verhuurders</span>'+
        '<span><b>'+r.un+'</b> uitverhuurd/wachtrij</span></div></div>'+
      '<div class="chart">'+spark(r.arr)+'</div>'+
      '<div class="advice"><span class="pill '+r.label[1]+'">'+r.label[0]+'</span><div class="reason">'+r.reason+'</div></div>'+
    '</div>';
  }).join("");
  $("note").textContent = "Koopadvies = vraag-score (70%) + stijgende-vraag-bonus + schaarste-bonus. Het leunt op beschikbaarheid, die we nog niet overal even scherp hebben — dus het advies wordt betrouwbaarder naarmate er meer schone dagen bijkomen. Cijfermatige terugverdientijd check je in de calculator; dit gaat puur over de vraag-kant.";
}

async function loadHist(u){ try{ const b=u+(u.includes("?")?"&":"?")+"t="+Date.now(); const r=await fetch(b,{cache:"no-store"}); if(!r.ok) throw 0; HIST=await r.json(); render(); return true; }catch(e){ return false; } }
async function loadNames(){ try{ const r=await fetch("prijsrace-data.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return; const d=await r.json(); (d.sets||[]).forEach(s=>{ NAMES[s.number]=s.name; }); render(); }catch(e){} }
function refresh(){ const u=($("hurl").value||"history.json").trim(); loadHist(u).then(ok=>{ if(!ok) alert("Kon history niet laden van: "+u); }); }
$("f").addEventListener("change",ev=>{ const file=ev.target.files[0]; if(!file) return; const rd=new FileReader(); rd.onload=()=>{ try{ HIST=JSON.parse(rd.result); render(); }catch(e){ alert("Ongeldige JSON: "+e.message);} }; rd.readAsText(file); });

loadHist(($("hurl").value||"history.json").trim());
loadNames();
</script>
</body>
</html>
