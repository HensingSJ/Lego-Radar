<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEGO Shorts-generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg0:#0A1120;--bg1:#16223C;--ink:#F5F7FA;--mute:#93A0B6;--line:#243450;
    --amber:#FFC72C;--green:#37E27A;--red:#FF5A5F;--steel:#6FA8FF;--track:#16213A}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05080f;font-family:"Archivo",system-ui,sans-serif;color:var(--ink)}
  body{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;max-width:560px}
  .controls select,.controls input,.btn{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;
    background:#101B30;border:1px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:9px;outline:none;cursor:pointer}
  .btn:hover{background:rgba(255,199,44,.12);border-color:var(--amber)}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:13px;background:#101B30;color:var(--mute);border:none;padding:9px 14px;cursor:pointer}
  .seg button.on{background:var(--amber);color:#0A1120}
  #dataurl{flex:1;min-width:120px}

  /* 9:16 stage, scaled */
  .stagewrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
  .stage{position:relative;width:1080px;height:1920px;flex:0 0 auto;transform-origin:center center;
    background:linear-gradient(135deg,var(--bg0),var(--bg1));overflow:hidden;color:var(--ink);
    padding:84px 74px;display:flex;flex-direction:column;border-radius:20px}
  .stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;
    background-image:radial-gradient(rgba(255,255,255,.05) 1.4px,transparent 1.4px);background-size:34px 34px}
  .finish{position:absolute;left:0;right:0;bottom:20%;height:22px;opacity:.4;
    background-image:conic-gradient(#e9eef7 90deg,#0a0f1a 0 180deg,#e9eef7 0 270deg,#0a0f1a 0);background-size:44px 22px}

  .top{position:relative;z-index:2;display:flex;gap:24px;align-items:flex-start}
  .top .txt{flex:1;min-width:0}
  .eyebrow{display:flex;align-items:center;gap:14px;font-family:"JetBrains Mono",monospace;font-weight:800;letter-spacing:.26em;font-size:30px;color:var(--amber);text-transform:uppercase}
  .rec{width:20px;height:20px;border-radius:50%;background:var(--red)}
  h1{font-family:"Archivo Black",sans-serif;font-size:96px;line-height:.92;letter-spacing:-.02em;margin-top:22px}
  .nr{color:var(--mute);font-size:.5em}
  .sub{font-family:"JetBrains Mono",monospace;font-size:32px;color:var(--mute);font-weight:700;margin-top:18px}
  .hero{width:300px;height:300px;flex:0 0 auto;border-radius:20px;border:1px solid var(--line);background:#0C1526 center/contain no-repeat;box-shadow:0 12px 40px rgba(0,0,0,.4)}

  .lanes{position:relative;z-index:2;display:flex;flex-direction:column;gap:38px;margin-top:70px}
  .lane{opacity:0;transform:translateX(-16px);transition:.5s ease}
  .lane.in{opacity:1;transform:none}
  .lane .top2{display:flex;align-items:flex-end;gap:20px;margin-bottom:16px}
  .num{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:36px;color:var(--mute);width:64px;height:64px;flex:0 0 auto;border:2px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center}
  .site{font-size:44px;font-weight:700;letter-spacing:-.01em}
  .tag{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:22px;letter-spacing:.1em;padding:8px 14px;border-radius:999px;background:#123322;color:var(--green);opacity:0;transform:scale(.6);transition:.4s ease}
  .lane.win .tag{opacity:1;transform:none}
  .price{margin-left:auto;font-family:"JetBrains Mono",monospace;font-weight:800;font-size:64px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .track{height:44px;border-radius:12px;background:var(--track);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.03)}
  .fill{height:100%;width:0;border-radius:12px;transition:width 1.1s cubic-bezier(.22,1,.36,1)}
  .note{font-family:"JetBrains Mono",monospace;font-size:24px;color:#6C7A93;margin-top:12px;opacity:0;transition:.4s ease}
  .note.show{opacity:1}
  .lane.g .fill{background:linear-gradient(90deg,#1c6b40,var(--green))}.lane.g .price{color:var(--green)}
  .lane.a .fill{background:linear-gradient(90deg,#a97f10,var(--amber))}.lane.a .price{color:var(--amber)}
  .lane.s .fill{background:linear-gradient(90deg,#2c5aa8,var(--steel))}.lane.s .price{color:var(--steel)}
  .lane.r .fill{background:linear-gradient(90deg,#a1353a,var(--red))}.lane.r .price{color:var(--red)}
  .lane.win .track{box-shadow:inset 0 0 0 2px rgba(55,226,122,.45),0 0 34px rgba(55,226,122,.28)}

  .kicker{position:relative;z-index:2;margin-top:auto;padding-top:36px;opacity:0;transform:translateY(16px);transition:.55s ease}
  .kicker.show{opacity:1;transform:none}
  .kicker .big{font-family:"Archivo Black",sans-serif;font-size:56px;line-height:1.02}
  .kicker .big b{color:var(--amber)}
  .kicker .small{font-family:"JetBrains Mono",monospace;font-size:28px;color:var(--mute);margin-top:16px}
</style>
</head>
<body>
  <div class="controls">
    <select id="setSel"></select>
    <div class="seg">
      <button id="mE" class="on" onclick="setModel('eenmalig')">Eenmalig</button>
      <button id="mR" onclick="setModel('regulier')">Regulier</button>
    </div>
    <button class="btn" onclick="play()">↻ Opnieuw</button>
    <input id="dataurl" placeholder="shorts-data.json" value="shorts-data.json">
    <button class="btn" onclick="refresh()">🔄</button>
  </div>

  <div class="stagewrap">
    <div class="stage" id="stage">
      <div class="finish"></div>
      <div class="top">
        <div class="txt">
          <div class="eyebrow"><span class="rec"></span>LEGO Prijsrace</div>
          <h1 id="title"></h1>
          <div class="sub" id="sub"></div>
        </div>
        <div class="hero" id="hero" style="display:none"></div>
      </div>
      <div class="lanes" id="lanes"></div>
      <div class="kicker" id="kicker"></div>
    </div>
  </div>

<script>
let DATA = {"generated":"voorbeeld","beurten_per_jaar":10,"sets":[
  {"number":"42206","name":"Oracle Red Bull Racing RB20","image":"",
   "eenmalig":[{"site":"Blokkenhuren","price":12.00,"note":"afhalen"},{"site":"Blokjes Te Huur","price":15.00,"note":"afhalen"},{"site":"HuurjeBricks","price":15.00,"note":"afhalen"},{"site":"Bouwsteenwinkel","price":23.50,"note":"+ €10,00/jr lidmaatschap · afhalen"},{"site":"Bricks Verhuur","price":59.00,"note":"+ €29,50/jr lidmaatschap · + €14,50 verzending"}],
   "regulier":[{"site":"Blokkenhuren","price":12.00,"note":"afhalen"},{"site":"Bouwsteenwinkel","price":14.50,"note":"+ €10,00/jr lidmaatschap · afhalen"},{"site":"Blokjes Te Huur","price":15.00,"note":"afhalen"},{"site":"HuurjeBricks","price":15.00,"note":"afhalen"},{"site":"Bricks Verhuur","price":32.45,"note":"+ €29,50/jr lidmaatschap · + €14,50 verzending"}]}
]};
let curSet = 0, curModel = "eenmalig", timers = [];
const $ = id => document.getElementById(id);
const eur = v => "€" + v.toFixed(2).replace(".", ",");
const SUBS = {eenmalig:"eindprijs · éénmalig huren", regulier:"prijs per beurt · vaak huren ("+(DATA.beurten_per_jaar||10)+"×/jr)"};

function fillSets(){
  const sel=$("setSel"); sel.innerHTML="";
  (DATA.sets||[]).forEach((s,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=s.number+" · "+s.name; sel.appendChild(o); });
  sel.onchange=()=>{ curSet=+sel.value; play(); };
  if(curSet>=(DATA.sets||[]).length) curSet=0;
}
function setModel(m){ curModel=m; $("mE").classList.toggle("on",m==="eenmalig"); $("mR").classList.toggle("on",m==="regulier"); play(); }

function role(i,last){ return i===0?"g":(i===last?"r":(i%2?"s":"a")); }

function build(){
  const set=(DATA.sets||[])[curSet]; if(!set) return;
  const rows=(set[curModel]||[]);
  $("title").innerHTML = set.name + ' <span class="nr">#'+set.number+'</span>';
  $("sub").textContent = SUBS[curModel];
  const hero=$("hero");
  if(set.image){ hero.style.display="block"; hero.style.backgroundImage="url('"+set.image+"')"; } else hero.style.display="none";

  const max=Math.max(...rows.map(r=>r.price),1), last=rows.length-1;
  const lanes=$("lanes"); lanes.innerHTML="";
  rows.forEach((r,i)=>{
    const lane=document.createElement("div");
    lane.className="lane "+role(i,last)+(i===0?" win":"");
    lane.dataset.w=(r.price/max*100).toFixed(1); lane.dataset.price=r.price;
    lane.innerHTML='<div class="top2"><span class="num">'+(i+1)+'</span><span class="site">'+r.site+'</span>'+
      (i===0?'<span class="tag">GOEDKOOPST</span>':'')+'<span class="price">€0,00</span></div>'+
      '<div class="track"><div class="fill"></div></div>'+
      (r.note?'<div class="note">'+r.note+'</div>':'');
    lanes.appendChild(lane);
  });
  const lo=rows[0]?.price, hi=rows[last]?.price;
  $("kicker").innerHTML='<div class="big">'+(curModel==="eenmalig"?"Zelfde set,":"Vaste huurder?")+' <b>'+
    (curModel==="eenmalig"?"grote prijsverschillen.":"kijk waar het kantelt.")+'</b></div>'+
    '<div class="small">'+eur(lo)+' – '+eur(hi)+' voor dezelfde set</div>';
}

function countUp(el,target,dur){
  const st=performance.now();
  (function t(now){ const p=Math.min(1,(now-st)/dur), e=1-Math.pow(1-p,3);
    el.textContent=eur(target*e); if(p<1) requestAnimationFrame(t); else el.textContent=eur(target); })(performance.now());
}
function play(){
  build();
  timers.forEach(clearTimeout); timers=[];
  const lanes=[...document.querySelectorAll('.lane')], kicker=$("kicker");
  lanes.forEach(l=>{ l.classList.remove('in'); l.querySelector('.fill').style.width='0'; l.querySelector('.price').textContent='€0,00'; const n=l.querySelector('.note'); if(n) n.classList.remove('show'); });
  kicker.classList.remove('show');
  lanes.forEach((lane,i)=>{
    timers.push(setTimeout(()=>{
      lane.classList.add('in');
      lane.querySelector('.fill').style.width=lane.dataset.w+'%';
      countUp(lane.querySelector('.price'), parseFloat(lane.dataset.price), 750);
      const n=lane.querySelector('.note'); if(n) timers.push(setTimeout(()=>n.classList.add('show'),780));
    }, 650+i*480));
  });
  timers.push(setTimeout(()=>kicker.classList.add('show'), 650+lanes.length*480+400));
}

function fit(){ const pad=140; const s=Math.min((window.innerWidth-24)/1080,(window.innerHeight-pad)/1920); $("stage").style.transform="scale("+s+")"; }
async function loadFromUrl(u){ try{ const b=u+(u.includes("?")?"&":"?")+"t="+Date.now(); const r=await fetch(b,{cache:"no-store"}); if(!r.ok) throw 0; DATA=await r.json(); curSet=0; fillSets(); play(); return true; }catch(e){ return false; } }
function refresh(){ const u=($("dataurl").value||"shorts-data.json").trim(); loadFromUrl(u).then(ok=>{ if(!ok) alert("Kon data niet laden van: "+u); }); }

window.addEventListener('resize', fit);
fillSets(); fit(); play();
loadFromUrl(($("dataurl").value||"shorts-data.json").trim());
</script>
</body>
</html>
